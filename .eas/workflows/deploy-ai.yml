# Publishes the AI server function (supabase/functions/heal-ai) and Myra's voice function (supabase/functions/voice) to the Supabase project in Mumbai,
# only when that function changes. Tests run before every push on Claude's side; the website
# (app.happyorange.in) is published by Cloudflare Pages, so EAS no longer deploys the web build.
# Free plan: 60 CI minutes a month (founder, 20 Oct 2026), so keep this job small.
# Needs a SUPABASE_ACCESS_TOKEN secret in the Expo project's environment variables (production).
name: Deploy AI server

on:
  push:
    branches: ['main']
    paths: ['supabase/functions/**', 'supabase/migrations/**']

jobs:
  deploy_ai:
    environment: production
    steps:
      - uses: eas/checkout
      - name: Deploy AI function to Supabase
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set yet; skipping the AI function deploy."
            exit 0
          fi
          npx -y supabase@2.121.0 functions deploy heal-ai --project-ref vjhzlszubdinmesfvmex --use-api
          npx -y supabase@2.121.0 functions deploy voice --project-ref vjhzlszubdinmesfvmex --use-api
          npx -y supabase@2.121.0 functions deploy review-login --project-ref vjhzlszubdinmesfvmex --use-api --no-verify-jwt
          # NeoSapien sign-in (decision 0050): checks the person itself, so the browser can reach its callback.
          npx -y supabase@2.121.0 functions deploy neosapien --project-ref vjhzlszubdinmesfvmex --use-api --no-verify-jwt
          # Database changes that are safe to run again (create ... if not exists), through Supabase's API.
          for f in supabase/migrations/0008_neosapien.sql supabase/migrations/0009_meal_checks.sql; do
            node -e "process.stdout.write(JSON.stringify({query: require('fs').readFileSync('$f','utf8')}))" > /tmp/q.json
            curl -sS -f -X POST "https://api.supabase.com/v1/projects/vjhzlszubdinmesfvmex/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json && echo " ran $f"
          done
